<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Learning</title>
</head>
<body> 
    <h1>My First JavaScript project</h1>
    <input type="text" id="studentname" placeholder="enter your name here">
    <button id="submitbtn">Resgister Student</button>
    <h3 id="result"></h3>


    <script>
        let button= document.getElementById("submitbtn");
        button.addEventListener("click",function(){
            let name=document.getElementById("studentname").value;
        let result=document.getElementById("result");
        result.innerHTML="Hello  "+name +" your registeration is susccessful.";

        })
    </script>   
    
</body>
</html>
